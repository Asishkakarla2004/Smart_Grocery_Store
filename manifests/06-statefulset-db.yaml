apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: smart-grocery}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports: [{name: postgres, containerPort: 5432}]
        env:
        - {name: POSTGRES_DB, valueFrom: {configMapKeyRef: {name: grocery-config, key: DB_NAME}}}
        - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: grocery-secrets, key: POSTGRES_USER}}}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: grocery-secrets, key: POSTGRES_PASSWORD}}}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 1Gi}}
        readinessProbe: {exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, initialDelaySeconds: 10, periodSeconds: 5}
        livenessProbe: {exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, initialDelaySeconds: 30, periodSeconds: 10}
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: grocery-gp3
      resources: {requests: {storage: 10Gi}}
