apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: smart-grocery}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
      - name: backend
        image: docker.io/REPLACE_ME/smart-grocery-backend:latest
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
        envFrom: [{configMapRef: {name: grocery-config}}]
        env:
        - {name: SPRING_DATASOURCE_USERNAME, valueFrom: {secretKeyRef: {name: grocery-secrets, key: POSTGRES_USER}}}
        - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: grocery-secrets, key: POSTGRES_PASSWORD}}}
        - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: grocery-secrets, key: JWT_SECRET}}}
        startupProbe: {httpGet: {path: /actuator/health, port: 8080}, failureThreshold: 30, periodSeconds: 10}
        readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, periodSeconds: 20}
        resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: 1000m, memory: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: smart-grocery}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - name: frontend
        image: docker.io/REPLACE_ME/smart-grocery-frontend:latest
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 80}]
        readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 20}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
