apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: smart-grocery}
spec: {clusterIP: None, selector: {app: postgres}, ports: [{name: postgres, port: 5432, targetPort: 5432}]}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: smart-grocery}
spec: {type: ClusterIP, selector: {app: backend}, ports: [{name: http, port: 8080, targetPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: smart-grocery}
spec: {type: ClusterIP, selector: {app: frontend}, ports: [{name: http, port: 80, targetPort: 80}]}
