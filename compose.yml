services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_grocery_db}
      POSTGRES_USER: ${POSTGRES_USER:-grocery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 10}
    networks: [grocery-net]
    ports: ["127.0.0.1:5432:5432"]
  backend:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-smart_grocery_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-grocery}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on: {database: {condition: service_healthy}}
    ports: ["8080:8080"]
    networks: [grocery-net]
  frontend:
    build: {context: ., dockerfile: Docker-app/Dockerfile}
    depends_on: [backend]
    ports: ["3000:80"]
    networks: [grocery-net]
networks: {grocery-net: {driver: bridge}}
volumes: {postgres_data: {}}
